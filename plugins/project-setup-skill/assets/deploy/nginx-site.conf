# /etc/nginx/sites-available/<appname>.example.com
#
# Enable and get a certificate:
#   sudo ln -s /etc/nginx/sites-available/<appname>.example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <appname>.example.com
#
# certbot rewrites this file in place: it adds a `listen 443 ssl` server block,
# the certificate paths, and an HTTP->HTTPS redirect. Everything below the
# `location /` line is preserved, so re-running certbot after an edit is safe.

server {
    listen 80;
    listen [::]:80;
    server_name <appname>.example.com;

    # Increase if you deal with large file uploads.
    # Must be >= any app-side upload limit, or nginx rejects the request
    # with a 413 before the app ever sees it.
    client_max_body_size 50M;

    location / {
        # Host port published by docker compose (APP_PORT in /opt/<appname>/.env).
        proxy_pass http://127.0.0.1:5000;

        # Standard proxy headers so the app knows the real client info.
        # X-Forwarded-Proto is what makes the app generate https:// URLs and
        # set Secure cookies — OAuth redirect URIs break without it.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Required for Blazor Server / SignalR WebSockets ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SignalR circuits can sit idle - don't let nginx kill them early.
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;

        # Avoid buffering issues with streaming/long-lived connections.
        # Also required for server-sent events (streamed LLM responses).
        proxy_buffering off;
    }
}
